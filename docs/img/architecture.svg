<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1244px;height:493px;background:#FFFFFF;" width="1244px" height="493px" viewBox="0 0 1244 493" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity S2--><g class="entity" data-qualified-name="S2" id="ent0001" data-source-line="6"><rect x="303.73" y="7" width="537.283" height="73.118" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="313.73" y="30.897" fill="#000" font-size="13" textLength="77.324" font-weight="700" font-family="Helvetica">System Two</text><text x="397.814" y="30.897" fill="#000" font-size="13" textLength="175.617" font-family="Helvetica">(slow, generative, expensive)</text><text x="313.73" y="48.603" fill="#000" font-size="13" textLength="158.34" font-family="Helvetica">Claude or your own agent</text><text x="313.73" y="66.309" fill="#000" font-size="13" textLength="517.283" font-family="Helvetica">writes atomic dated notes · synthesises patterns · answers with the recalled evidence</text></g><!--entity JM--><g class="entity" data-qualified-name="JM" id="ent0002" data-source-line="8"><rect x="410.34" y="177.12" width="324.057" height="143.942" fill="#E0F2FE" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="420.34" y="201.017" fill="#000" font-size="13" textLength="52.169" font-weight="700" font-family="Helvetica">jevmem</text><text x="479.269" y="201.017" fill="#000" font-size="13" textLength="180.505" font-family="Helvetica">(never calls a generative LLM)</text><text x="420.34" y="218.723" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="420.34" y="236.429" fill="#000" font-size="13" textLength="304.057" font-family="Helvetica">MCP server · Claude Code hooks · CLI · Python API</text><text x="420.34" y="254.135" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="420.34" y="271.841" fill="#000" font-size="13" textLength="34.229" font-weight="700" font-family="Helvetica">write</text><text x="454.569" y="271.841" fill="#000" font-size="13" textLength="144.726" font-family="Helvetica">: screen → type → relate</text><text x="420.34" y="289.547" fill="#000" font-size="13" textLength="35.815" font-weight="700" font-family="Helvetica">recall</text><text x="456.155" y="289.547" fill="#000" font-size="13" textLength="208.256" font-family="Helvetica">: route → anchor → expand → stop</text><text x="420.34" y="307.253" fill="#000" font-size="13" textLength="75.101" font-weight="700" font-family="Helvetica">consolidate</text><text x="495.441" y="307.253" fill="#000" font-size="13" textLength="189.514" font-family="Helvetica">: supersede · dedupe · patterns</text></g><!--entity S1--><g class="entity" data-qualified-name="S1" id="ent0003" data-source-line="10"><rect x="738.7" y="400.06" width="491.341" height="73.118" fill="#DCFCE7" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="748.7" y="423.957" fill="#000" font-size="13" textLength="77.064" font-weight="700" font-family="Helvetica">System One</text><text x="832.524" y="423.957" fill="#000" font-size="13" textLength="115.752" font-family="Helvetica">(fast, cheap, typed)</text><text x="748.7" y="441.663" fill="#000" font-size="13" textLength="471.341" font-family="Helvetica">Jev by TypeSafe: answers typed questions with probabilities, never writes text</text><text x="748.7" y="459.369" fill="#000" font-size="13" textLength="169.013" font-family="Helvetica">~0.25 s · ~$0.0002 per recall</text></g><!--entity DB--><g class="entity" data-qualified-name="DB" id="ent0004" data-source-line="12"><path d="M6,414.41 C6,404.41 159.371,404.41 159.371,404.41 C159.371,404.41 312.741,404.41 312.741,414.41 L312.741,458.822 C312.741,468.822 159.371,468.822 159.371,468.822 C159.371,468.822 6,468.822 6,458.822 L6,414.41" style="stroke:#64748B;str