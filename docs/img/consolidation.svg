ily="Helvetica">same question, different answer? outdated? reports a change?</text><text x="327.247" y="224.495" fill="#334155" font-size="13" textLength="296.504" font-family="Helvetica">states every fact of the other? repeated episode?</text><line x1="725.355" y1="279.716" x2="767.355" y2="279.716" style="stroke:#475569;stroke-width:1;"/><line x1="767.355" y1="279.716" x2="767.355" y2="292.716" style="stroke:#475569;stroke-width:1;"/><line x1="726.355" y1="292.716" x2="767.355" y2="292.716" style="stroke:#475569;stroke-width:1;"/><polygon points="736.355,288.716,726.355,292.716,736.355,296.716,732.355,292.716" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="732.355" y="256.201" fill="#334155" font-size="13" textLength="121.212" font-family="Helvetica">order by timestamp</text><text x="732.355" y="273.907" fill="#334155" font-size="13" textLength="310.606" font-family="Helvetica">(tie → latest date in text → who reports the change)</text><polygon points="1037.961,320.422,1047.961,324.422,1037.961,328.422,1041.961,324.422" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="725.355" y1="324.422" x2="1043.961" y2="324.422" style="stroke:#475569;stroke-width:1;"/><text x="732.355" y="318.613" fill="#334155" font-size="13" textLength="77.492" font-family="Helvetica">older note ➜</text><text x="813.227" y="318.613" fill="#334155" font-size="13" textLength="96.226" font-weight="700" font-family="Helvetica">superseded_by</text><text x="912.833" y="318.613" fill="#334155" font-size="13" textLength="38.285" font-family="Helvetica">newer</text><polygon points="1037.961,352.128,1047.961,356.128,1037.961,360.128,1041.961,356.128" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="725.355" y1="356.128" x2="1043.961" y2="356.128" style="stroke:#475569;stroke-width:1;"/><text x="732.355" y="350.319" fill="#334155" font-size="13" textLength="92.234" font-family="Helvetica">fully covered ➜</text><text x="827.969" y="350.319" fill="#334155" font-size="13" textLength="178.997" font-weight="700" font-family="Helvetica">duplicate_of / subsumed_by</text><polygon points="1037.961,383.834,1047.961,387.834,1037.961,391.834,1041.961,387.834" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="725.355" y1="387.834" x2="1043.961" y2="387.834" style="stroke:#475569;stroke-width:1;"/><text x="732.355" y="382.025" fill="#334155" font-size="13" textLength="90.245" font-family="Helvetica">unorderable ➜</text><text x="825.98" y="382.025" fill="#334155" font-size="13" textLength="73.502" font-weight="700" font-family="Helvetica">contradicts</text><text x="902.862" y="382.025" fill="#334155" font-size="13" textLength="112.411" font-family="Helvetica">+ conflict proposal</text><polygon points="1290.099,415.54,1300.099,419.54,1290.099,423.54,1294.099,419.54" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="725.355" y1="419.54" x2="1296.099" y2="419.54" style="stroke:#475569;stroke-width:1;"/><text x="732.355" y="413.731" fill="#334155" font-size="13" textLength="294.592" font-family="Helvetica">repeated episodes ➜ "write the general pattern"</text><polygon points="1060.961,447.246,1050.961,451.246,1060.961,455.246,1056.961,451.246" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1054.961" y1="451.246" x2="1301.099" y2="451.246" style="stroke:#475569;stroke-width:1;"/><text x="1066.961" y="445.437" fill="#334155" font-size="13" textLength="228.137" font-family="Helvetica">memory_resolve (new semantic note)</text><path d="M1054.961,470.246 L1054.961,521.246 A6,6 0 0 0 1060.961,527.246 L1309.961,527.246 A6,6 0 0 0 1315.961,521.246 L1315.961,474.246 L1305.961,464.246 L1060.961,464.246 A6,6 0 0 0 1054.961,470.246" style="stroke