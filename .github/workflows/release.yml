name: Release
# Runs only when a tag like v0.1.0 is pushed. Publishing needs a PyPI "trusted publisher" configured for this repo
# (pypi.org -> project -> Publishing) and a GitHub environment named "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag must match the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: uv run --extra all pytest -q -rs     # plain `uv run` would drop the index extra
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
