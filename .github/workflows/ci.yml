name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the git-awareness tests build their own repos, but keep full history anyway
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Configure git identity for the branch-aware tests
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      # pgserver (embedded Postgres, tests only) is a dev dependency only where it has wheels (not Windows, not
      # Python 3.13); the pgvector tests importorskip it.
      # `uv run` re-syncs on its own: without UV_PYTHON and --extra it would rebuild a 3.12 venv without the index
      # backends, so the 3.13 jobs would test 3.12 and skip the index tests.
      - run: uv run --extra index pytest -q -rs

  install-smoke:
    name: clean install of the built wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Install the wheel into an empty venv and exercise the entry points without a Jev key
        shell: bash
        env:
          JEVMEM_DB: ${{ runner.temp }}/smoke.db
          JEVMEM_SCOPE: project:smoke
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$BIN/python.exe"; else PY="$BIN/python"; fi
          uv pip install --python "$PY" dist/*.whl
          cd "$RUNNER_TEMP"                               # away from the checkout: nothing may depend on the repo
          "$BIN/jevmem" --help > /dev/null
          "$BIN/jevmem" stats
          # With no key the hooks must fail open: exit 0 and print nothing harmful.
          echo '{"cwd": "."}' | "$BIN/jevmem" hook session-start
          echo '{"cwd": ".", "prompt": "what database does the shop use?"}' | "$BIN/jevmem" hook user-prompt
          "$BIN/python" - <<'PY'
          import asyncio
          from jevmem import mcp_server
          tools = asyncio.run(mcp_server.mcp.list_tools())
          names = {t.name for t in tools}
          assert {"memory_write", "memory_recall", "memory_list", "memory_forget"} <= names, names
          print(sorted(names))
          PY

  pgvector:
    name: pgvector index against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JEVMEM_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --extra index pytest -q -rs tests/test_index.py
